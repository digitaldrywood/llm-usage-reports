[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Beyond ruff's defaults (pyflakes + a slice of pycodestyle): import order,
# likely-bug patterns, modern-Python rewrites, and comprehension cleanups.
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The report is a single self-contained HTML/CSS/JS template string; long lines
# there are markup, not code.
"scripts/generate_report.py" = ["E501"]
